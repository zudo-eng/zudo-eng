<svg width="700" height="320" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Animated hacker terminal with matrix code rain</title>
<desc>A dark terminal window with a blinking cursor and typed lines, over a falling green matrix code rain background</desc>
<defs>
