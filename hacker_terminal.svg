<text x="614" y="0" opacity="0.5"><animate attributeName="y" from="-20" to="340" dur="2.0s" begin="1.0s" repeatCount="indefinite"/>81E3A</text>
<text x="648" y="0"><animate attributeName="y" from="-20" to="340" dur="2.7s" begin="0.4s" repeatCount="indefinite"/>D5B27</text>
